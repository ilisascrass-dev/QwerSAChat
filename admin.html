<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>QwerSAChat — Admin Panel</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js">
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0a0a12;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(88, 130, 255, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(255, 70, 200, 0.06) 0%, transparent 60%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .app {
            max-width: 560px;
            width: 100%;
            height: 780px;
            background: rgba(18, 22, 36, 0.92);
            backdrop-filter: blur(40px) saturate(1.4);
            -webkit-backdrop-filter: blur(40px) saturate(1.4);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* ===== AUTH ===== */
        .auth-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
            padding: 32px 28px;
        }

        .auth-screen .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-screen .logo h1 {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #ff6b6b, #ffd93d, #6bcb77);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .auth-screen .logo p {
            color: rgba(255, 255, 255, 0.2);
            font-size: 14px;
            margin-top: 4px;
        }

        .auth-form {
            display: none;
            flex-direction: column;
            gap: 14px;
        }

        .auth-form.active {
            display: flex;
        }

        .auth-form input {
            padding: 14px 18px;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.04);
            color: #e3ecf5;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
        }

        .auth-form input:focus {
            border-color: rgba(100, 150, 255, 0.3);
            background: rgba(255, 255, 255, 0.06);
        }

        .auth-form input::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }

        .auth-form .btn-primary {
            padding: 14px;
            border: none;
            border-radius: 60px;
            background: linear-gradient(135deg, #ff6b6b, #ffd93d);
            color: #0a0a12;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 25px rgba(255, 107, 107, 0.2);
        }

        .auth-form .btn-primary:hover {
            transform: scale(1.01);
            box-shadow: 0 8px 35px rgba(255, 107, 107, 0.3);
        }

        .auth-form .btn-primary:active {
            transform: scale(0.97);
        }

        .auth-switch {
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
            text-align: center;
        }

        .auth-switch a {
            color: #ff6b6b;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
        }

        .auth-switch a:hover {
            color: #ff8a8a;
        }

        .status-msg {
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            padding: 8px 16px;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.03);
            text-align: center;
            min-height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ===== MAIN ===== */
        .main-app {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        .main-app.active {
            display: flex;
        }

        .header {
            padding: 16px 20px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            flex-shrink: 0;
            background: rgba(18, 22, 36, 0.95);
        }

        .header h1 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #ff6b6b, #ffd93d, #6bcb77);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header .admin-badge {
            background: rgba(255, 107, 107, 0.15);
            color: #ff6b6b;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 11px;
            font-weight: 600;
            border: 1px solid rgba(255, 107, 107, 0.2);
        }

        .header .right {
            display: flex;
            gap: 8px;
        }

        .header .right button {
            padding: 6px 14px;
            border: none;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.4);
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .header .right button:hover {
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.7);
        }

        .header .right .logout-btn {
            background: rgba(255, 70, 70, 0.1);
            color: #ff6b6b;
        }

        .header .right .logout-btn:hover {
            background: rgba(255, 70, 70, 0.2);
        }

        /* ===== STATS ===== */
        .stats {
            display: flex;
            gap: 12px;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            flex-shrink: 0;
        }

        .stats .stat {
            flex: 1;
            text-align: center;
            padding: 8px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
        }

        .stats .stat .num {
            color: #eef4fa;
            font-size: 20px;
            font-weight: 700;
        }

        .stats .stat .label {
            color: rgba(255, 255, 255, 0.3);
            font-size: 11px;
            margin-top: 2px;
        }

        /* ===== SEARCH ===== */
        .search-bar {
            padding: 10px 16px 14px;
            flex-shrink: 0;
            background: rgba(18, 22, 36, 0.95);
        }

        .search-bar input {
            width: 100%;
            padding: 10px 16px;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            background: rgba(255, 255, 255, 0.03);
            color: #e3ecf5;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }

        .search-bar input:focus {
            border-color: rgba(100, 150, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
        }

        .search-bar input::placeholder {
            color: rgba(255, 255, 255, 0.15);
        }

        /* ===== USER LIST ===== */
        .user-list {
            flex: 1;
            overflow-y: auto;
            padding: 4px 12px 12px;
        }

        .user-list::-webkit-scrollbar {
            width: 3px;
        }
        .user-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .user-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
        }

        .user-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 14px;
            border: 1px solid transparent;
            margin-bottom: 4px;
            transition: all 0.2s;
            position: relative;
        }

        .user-item:hover {
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.04);
        }

        .user-item.banned {
            opacity: 0.4;
            background: rgba(255, 70, 70, 0.05);
            border-color: rgba(255, 70, 70, 0.1);
        }

        .user-item .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
            background: linear-gradient(135deg, #4a7cf7, #7c5cfc);
            overflow: hidden;
        }

        .user-item .avatar img,
        .user-item .avatar video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .user-item .info {
            flex: 1;
            min-width: 0;
        }

        .user-item .info .name {
            color: #eef4fa;
            font-weight: 600;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .user-item .info .name .verified {
            color: #4a7cf7;
            font-size: 14px;
        }

        .user-item .info .email {
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
        }

        .user-item .info .password {
            color: rgba(255, 255, 255, 0.15);
            font-size: 11px;
            font-family: monospace;
        }

        .user-item .info .badge {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 40px;
            margin-left: 4px;
        }

        .user-item .info .badge.banned-badge {
            background: rgba(255, 70, 70, 0.15);
            color: #ff6b6b;
        }

        .user-item .info .badge.admin-badge-sm {
            background: rgba(255, 215, 0, 0.15);
            color: #ffd93d;
        }

        .user-item .actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        .user-item .actions button {
            padding: 4px 10px;
            border: none;
            border-radius: 40px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .user-item .actions .verify-btn {
            background: rgba(74, 124, 247, 0.15);
            color: #4a7cf7;
        }

        .user-item .actions .verify-btn:hover {
            background: rgba(74, 124, 247, 0.25);
        }

        .user-item .actions .verify-btn.active {
            background: rgba(74, 124, 247, 0.3);
            color: #4a7cf7;
        }

        .user-item .actions .ban-btn {
            background: rgba(255, 70, 70, 0.1);
            color: #ff6b6b;
        }

        .user-item .actions .ban-btn:hover {
            background: rgba(255, 70, 70, 0.2);
        }

        .user-item .actions .ban-btn.active {
            background: rgba(255, 70, 70, 0.2);
            color: #ff6b6b;
        }

        .user-item .actions .delete-btn {
            background: rgba(255, 70, 70, 0.15);
            color: #ff6b6b;
        }

        .user-item .actions .delete-btn:hover {
            background: rgba(255, 70, 70, 0.3);
        }

        .empty-state {
            text-align: center;
            color: rgba(255, 255, 255, 0.15);
            padding: 60px 20px;
            font-size: 14px;
        }

        .empty-state .icon {
            font-size: 48px;
            display: block;
            margin-bottom: 12px;
        }

        .toast {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 60px;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            color: #eef4fa;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.06);
            opacity: 0;
            transition: all 0.4s;
            z-index: 50;
            pointer-events: none;
            max-width: 90%;
            text-align: center;
        }

        .toast.show {
            opacity: 1;
            bottom: 30px;
        }

        .toast.success {
            border-color: rgba(107, 203, 119, 0.3);
        }

        .toast.error {
            border-color: rgba(255, 70, 70, 0.3);
        }

        @media (max-width: 500px) {
            .app {
                border-radius: 0;
                height: 100vh;
                max-height: 100vh;
            }
            .auth-screen {
                padding: 24px 16px;
            }
            .header {
                padding: 12px 16px 10px;
            }
            .header h1 {
                font-size: 16px;
            }
            .stats {
                padding: 8px 12px;
                flex-wrap: wrap;
            }
            .stats .stat {
                min-width: 60px;
            }
            .user-item {
                padding: 8px 10px;
                flex-wrap: wrap;
            }
            .user-item .actions {
                width: 100%;
                justify-content: flex-end;
            }
            .user-item .actions button {
                padding: 3px 8px;
                font-size: 10px;
            }
        }
    </style>
</head>
<body>

<div class="app" id="app">

    <!-- ===== AUTH ===== -->
    <div class="auth-screen" id="authScreen">
        <div class="logo">
            <h1>🛡️ Admin Panel</h1>
            <p>Управление пользователями</p>
        </div>

        <div class="auth-form active" id="loginForm">
            <input type="email" id="loginEmail" placeholder="Email администратора" />
            <input type="password" id="loginPassword" placeholder="Пароль" />
            <button class="btn-primary" id="loginBtn">🔑 Войти</button>
            <div id="loginStatus" class="status-msg"></div>
        </div>
    </div>

    <!-- ===== MAIN ===== -->
    <div class="main-app" id="mainApp">
        <div class="header">
            <div style="display:flex;align-items:center;gap:10px;">
                <h1>🛡️ Admin Panel</h1>
                <span class="admin-badge">ADMIN</span>
            </div>
            <div class="right">
                <button id="refreshBtn">🔄</button>
                <button class="logout-btn" id="logoutBtn">🚪</button>
            </div>
        </div>

        <div class="stats" id="statsBar">
            <div class="stat">
                <div class="num" id="totalUsers">0</div>
                <div class="label">Всего</div>
            </div>
            <div class="stat">
                <div class="num" id="verifiedUsers">0</div>
                <div class="label">Вериф.</div>
            </div>
            <div class="stat">
                <div class="num" id="bannedUsers">0</div>
                <div class="label">Забан.</div>
            </div>
        </div>

        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="🔍 Поиск по email, имени или ID..." />
        </div>

        <div class="user-list" id="userList">
            <div class="empty-state">
                <span class="icon">👥</span>
                Загрузка пользователей...
            </div>
        </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast"></div>
</div>

<script>
    (function() {
        // ===== FIREBASE КОНФИГ =====
        const firebaseConfig = {
            apiKey: "AIzaSyCqA6dtnpAKKBgBBh5Wcx5eDdOaCsizGE0",
            authDomain: "qwersachat.firebaseapp.com",
            projectId: "qwersachat",
            storageBucket: "qwersachat.firebasestorage.app",
            messagingSenderId: "216724212476",
            appId: "1:216724212476:web:a2c1b2f5962124b9a5e579",
            measurementId: "G-XCZFG4BDTD"
        };

        // ===== ИНИЦИАЛИЗАЦИЯ =====
        let db = null;
        let auth = null;
        let isFirebaseReady = false;
        let currentUser = null;
        let allUsers = [];
        let listener = null;

        function initFirebase() {
            try {
                firebase.initializeApp(firebaseConfig);
                db = firebase.firestore();
                auth = firebase.auth();
                isFirebaseReady = true;
                db.enablePersistence().catch(() => {});
                console.log('🔥 Firebase готов!');
                return true;
            } catch (e) {
                console.error('❌ Ошибка:', e);
                document.getElementById('firebaseStatus').textContent = '❌ Ошибка подключения';
                return false;
            }
        }

        // ===== DOM =====
        const authScreen = document.getElementById('authScreen');
        const mainApp = document.getElementById('mainApp');
        const loginForm = document.getElementById('loginForm');
        const loginEmail = document.getElementById('loginEmail');
        const loginPassword = document.getElementById('loginPassword');
        const loginBtn = document.getElementById('loginBtn');
        const loginStatus = document.getElementById('loginStatus');
        const logoutBtn = document.getElementById('logoutBtn');
        const refreshBtn = document.getElementById('refreshBtn');

        const userList = document.getElementById('userList');
        const searchInput = document.getElementById('searchInput');
        const totalUsers = document.getElementById('totalUsers');
        const verifiedUsers = document.getElementById('verifiedUsers');
        const bannedUsers = document.getElementById('bannedUsers');
        const toast = document.getElementById('toast');

        // ===== TOAST =====
        let toastTimeout = null;

        function showToast(msg, type = 'success') {
            toast.textContent = msg;
            toast.className = 'toast show ' + type;
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // ===== АДМИН: ПРОВЕРКА =====
        const ADMIN_EMAILS = ['ilisascrass@gmail.com'];

        function isAdmin(email) {
            return ADMIN_EMAILS.includes(email);
        }

        // ===== ЗАГРУЗКА ПОЛЬЗОВАТЕЛЕЙ =====
        function loadUsers() {
            if (!isFirebaseReady) return;

            if (listener) listener();

            listener = db.collection('users').onSnapshot((snapshot) => {
                allUsers = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.id !== undefined) {
                        allUsers.push({ ...data, docId: doc.id });
                    }
                });
                console.log('👥 Загружено пользователей:', allUsers.length);
                renderUsers(searchInput.value);
                updateStats();
            }, (error) => {
                console.error('Ошибка загрузки:', error);
                showToast('❌ Ошибка загрузки пользователей', 'error');
            });
        }

        function updateStats() {
            const total = allUsers.length;
            const verified = allUsers.filter(u => u.verified === true).length;
            const banned = allUsers.filter(u => u.banned === true).length;
            totalUsers.textContent = total;
            verifiedUsers.textContent = verified;
            bannedUsers.textContent = banned;
        }

        function renderUsers(filter = '') {
            const f = filter.toLowerCase().trim();
            let filtered = allUsers;

            if (f) {
                filtered = allUsers.filter(u =>
                    u.email.toLowerCase().includes(f) ||
                    u.displayName.toLowerCase().includes(f) ||
                    String(u.id).includes(f)
                );
            }

            if (filtered.length === 0) {
                userList.innerHTML = `
                    <div class="empty-state">
                        <span class="icon">👀</span>
                        ${f ? 'Ничего не найдено' : 'Пользователей пока нет'}
                    </div>
                `;
                return;
            }

            let html = '';
            filtered.forEach(user => {
                const isBanned = user.banned === true;
                const isVerified = user.verified === true;
                const isAdminUser = isAdmin(user.email);
                const avatar = user.avatar || '👤';
                const avatarData = user.avatarData || null;

                let avatarHTML = '';
                if (avatarData) {
                    if (avatarData.startsWith('data:image')) {
                        avatarHTML = `<img src="${avatarData}" alt="avatar" />`;
                    } else if (avatarData.startsWith('data:video')) {
                        avatarHTML = `<video src="${avatarData}" autoplay loop muted playsinline></video>`;
                    } else {
                        avatarHTML = `<span class="avatar-emoji">${avatar}</span>`;
                    }
                } else {
                    avatarHTML = `<span class="avatar-emoji">${avatar}</span>`;
                }

                html += `
                    <div class="user-item ${isBanned ? 'banned' : ''}">
                        <div class="avatar">${avatarHTML}</div>
                        <div class="info">
                            <div class="name">
                                ${user.displayName}
                                ${isVerified ? '<span class="verified">✓</span>' : ''}
                                ${isBanned ? '<span class="badge banned-badge">⛔ Забанен</span>' : ''}
                                ${isAdminUser ? '<span class="badge admin-badge-sm">👑 Admin</span>' : ''}
                            </div>
                            <div class="email">${user.email}</div>
                            <div class="password">🔑 ${user.password || '—'}</div>
                        </div>
                        <div class="actions">
                            ${!isAdminUser ? `
                                <button class="verify-btn ${isVerified ? 'active' : ''}" data-email="${user.email}" title="Выдать/убрать галочку">✓</button>
                                <button class="ban-btn ${isBanned ? 'active' : ''}" data-email="${user.email}" title="Забанить/разбанить">⛔</button>
                                <button class="delete-btn" data-email="${user.email}" title="Удалить аккаунт">🗑️</button>
                            ` : `
                                <span style="color:rgba(255,215,0,0.3);font-size:11px;">👑 Админ</span>
                            `}
                        </div>
                    </div>
                `;
            });

            userList.innerHTML = html;

            // ===== СОБЫТИЯ КНОПОК =====
            document.querySelectorAll('.verify-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const email = this.dataset.email;
                    toggleVerify(email);
                });
            });

            document.querySelectorAll('.ban-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const email = this.dataset.email;
                    toggleBan(email);
                });
            });

            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const email = this.dataset.email;
                    if (confirm(`Удалить пользователя ${email}? Это действие необратимо!`)) {
                        deleteUser(email);
                    }
                });
            });
        }

        // ===== ДЕЙСТВИЯ АДМИНА =====
        async function toggleVerify(email) {
            const user = allUsers.find(u => u.email === email);
            if (!user) return;

            const newVerified = !user.verified;
            try {
                await db.collection('users').doc(user.docId).update({ verified: newVerified });
                showToast(`${newVerified ? '✅' : '❌'} Галочка ${newVerified ? 'выдана' : 'убрана'} для ${email}`, 'success');
                user.verified = newVerified;
                renderUsers(searchInput.value);
                updateStats();
            } catch (e) {
                showToast('❌ Ошибка: ' + e.message, 'error');
            }
        }

        async function toggleBan(email) {
            const user = allUsers.find(u => u.email === email);
            if (!user) return;

            const newBanned = !user.banned;
            try {
                await db.collection('users').doc(user.docId).update({ banned: newBanned });
                showToast(`${newBanned ? '⛔' : '✅'} Пользователь ${newBanned ? 'забанен' : 'разбанен'}`, 'success');
                user.banned = newBanned;
                renderUsers(searchInput.value);
                updateStats();
            } catch (e) {
                showToast('❌ Ошибка: ' + e.message, 'error');
            }
        }

        async function deleteUser(email) {
            const user = allUsers.find(u => u.email === email);
            if (!user) return;

            try {
                await db.collection('users').doc(user.docId).delete();

                try {
                    const userRecord = await auth.getUserByEmail(email);
                    await auth.deleteUser(userRecord.uid);
                } catch (e) {
                    console.warn('Не удалось удалить из Auth:', e);
                }

                showToast(`✅ Пользователь ${email} удалён`, 'success');
                allUsers = allUsers.filter(u => u.email !== email);
                renderUsers(searchInput.value);
                updateStats();
            } catch (e) {
                showToast('❌ Ошибка: ' + e.message, 'error');
            }
        }

        // ===== АВТОРИЗАЦИЯ =====
        async function login() {
            const email = loginEmail.value.trim();
            const password = loginPassword.value.trim();

            if (!email || !password) {
                showStatus(loginStatus, '❌ Введите email и пароль', true);
                return;
            }

            try {
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const uid = userCredential.user.uid;

                if (!isAdmin(email)) {
                    await auth.signOut();
                    showStatus(loginStatus, '❌ Доступ запрещён. Только для администраторов.', true);
                    return;
                }

                const doc = await db.collection('users').doc(uid).get();
                if (!doc.exists) {
                    showStatus(loginStatus, '❌ Пользователь не найден', true);
                    return;
                }

                currentUser = { ...doc.data(), uid };
                showStatus(loginStatus, '✅ Вход выполнен!');
                enterApp();
            } catch (e) {
                showStatus(loginStatus, '❌ ' + e.message, true);
            }
        }

        function showStatus(el, msg, isError = false) {
            el.textContent = msg;
            el.style.color = isError ? '#ff6b6b' : 'rgba(255,255,255,0.5)';
        }

        function enterApp() {
            authScreen.style.display = 'none';
            mainApp.classList.add('active');
            loadUsers();
        }

        async function logout() {
            if (listener) listener();
            await auth.signOut();
            currentUser = null;
            authScreen.style.display = 'flex';
            mainApp.classList.remove('active');
            loginStatus.textContent = '';
            loginEmail.value = '';
            loginPassword.value = '';
        }

        // ===== СОБЫТИЯ =====
        loginBtn.addEventListener('click', login);
        loginPassword.addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });
        loginEmail.addEventListener('keydown', (e) => { if (e.key === 'Enter') loginPassword.focus(); });

        logoutBtn.addEventListener('click', logout);
        refreshBtn.addEventListener('click', () => {
            renderUsers(searchInput.value);
            updateStats();
            showToast('🔄 Обновлено', 'success');
        });

        searchInput.addEventListener('input', () => {
            renderUsers(searchInput.value);
        });

        // ===== ЗАПУСК =====
        console.log('🛡️ Admin Panel');
        console.log('📧 Доступ для: ilisascrass@gmail.com');

        const firebaseInit = initFirebase();

        if (firebaseInit) {
            auth.onAuthStateChanged(async (user) => {
                if (user) {
                    try {
                        const doc = await db.collection('users').doc(user.uid).get();
                        if (doc.exists && isAdmin(doc.data().email)) {
                            currentUser = { ...doc.data(), uid: user.uid };
                            enterApp();
                            console.log('✅ Автовход для:', currentUser.displayName);
                        } else {
                            await auth.signOut();
                            console.log('👋 Не админ');
                        }
                    } catch (e) {
                        console.warn('Ошибка автовхода:', e);
                    }
                } else {
                    console.log('👋 Автовход не выполнен');
                }
            });
        }

        // Предзаполнение полей для удобства
        loginEmail.value = 'ilisascrass@gmail.com';
        loginPassword.value = '';

        console.log('📌 Для входа используйте: ilisascrass@gmail.com');
    })();
</script>

</body>
</html>
