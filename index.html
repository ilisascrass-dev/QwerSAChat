<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QwersaChat · мессенджер</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: #0a0a12;
            color: #ffffff;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #app {
            width: 100%;
            height: 100%;
            max-width: 1200px;
            max-height: 900px;
            display: flex;
            flex-direction: column;
            position: relative;
            background: rgba(12, 12, 20, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: rgba(124, 92, 252, 0.4);
            border-radius: 20px;
        }

        .screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            animation: fadeIn 0.35s ease;
        }
        .screen.active { display: flex; }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        /* ---------- АВТОРИЗАЦИЯ ---------- */
        .auth-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow-y: auto;
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            background: rgba(20, 20, 32, 0.8);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 36px;
            padding: 40px 32px;
            box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.9);
            transition: all 0.3s;
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .auth-logo h1 {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #4a7cf7, #7c5cfc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }
        .auth-logo p {
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            margin-top: 6px;
        }

        .auth-tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            padding: 4px;
            margin-bottom: 28px;
        }

        .auth-tab {
            flex: 1;
            padding: 12px 0;
            text-align: center;
            border-radius: 16px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.5);
            transition: all 0.3s;
            user-select: none;
            background: transparent;
            border: none;
            font-family: inherit;
        }
        .auth-tab.active {
            background: linear-gradient(135deg, #4a7cf7, #7c5cfc);
            color: white;
            box-shadow: 0 8px 20px -6px rgba(74, 124, 247, 0.5);
        }

        .auth-form {
            display: none;
            flex-direction: column;
            gap: 16px;
            animation: slideUp 0.3s ease;
        }
        .auth-form.active { display: flex; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .input-group label {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            padding-left: 4px;
            font-weight: 500;
        }
        .input-group input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 16px 20px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
            font-family: inherit;
        }
        .input-group input::placeholder { color: rgba(255, 255, 255, 0.2); }
        .input-group input:focus {
            border-color: #4a7cf7;
            background: rgba(74, 124, 247, 0.06);
            box-shadow: 0 0 0 4px rgba(74, 124, 247, 0.1);
        }

        .btn {
            background: linear-gradient(135deg, #4a7cf7, #7c5cfc);
            border: none;
            border-radius: 18px;
            padding: 16px 24px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 12px 28px -8px rgba(74, 124, 247, 0.5);
        }
        .btn:hover { transform: translateY(-2px); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .auth-error {
            background: rgba(255, 60, 60, 0.12);
            border: 1px solid rgba(255, 60, 60, 0.3);
            border-radius: 14px;
            padding: 12px 16px;
            font-size: 13px;
            color: #ff6b6b;
            display: none;
            margin-top: 4px;
        }
        .auth-error.show { display: block; }

        /* ---------- ОСНОВНОЙ ЭКРАН ---------- */
        .main-header {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            gap: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(14, 14, 24, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 10;
            flex-shrink: 0;
        }

        .header-avatar {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4a7cf7, #7c5cfc);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
            cursor: pointer;
            transition: transform 0.3s;
            border: 2px solid rgba(255, 255, 255, 0.08);
            overflow: hidden;
        }
        .header-avatar:hover { transform: scale(1.05); }
        .header-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .header-info { flex: 1; min-width: 0; }
        .header-info .name {
            font-size: 16px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .header-info .nick {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-actions { display: flex; gap: 8px; }

        .icon-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 18px;
            color: rgba(255, 255, 255, 0.7);
            flex-shrink: 0;
        }
        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            transform: scale(1.05);
        }
        .icon-btn.logout:hover {
            background: rgba(255, 60, 60, 0.2);
            color: #ff6b6b;
        }

        /* ---------- ПОИСК ---------- */
        .search-bar { padding: 12px 20px; flex-shrink: 0; }
        .search-bar input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 14px 20px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
            font-family: inherit;
        }
        .search-bar input::placeholder { color: rgba(255, 255, 255, 0.25); }
        .search-bar input:focus {
            border-color: #4a7cf7;
            background: rgba(74, 124, 247, 0.06);
            box-shadow: 0 0 0 4px rgba(74, 124, 247, 0.1);
        }

        /* ---------- СПИСОК ЧАТОВ ---------- */
        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 12px 12px;
        }

        .chat-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            border-radius: 22px;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 4px;
            border: 1px solid transparent;
        }
        .chat-item:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.06);
        }
        .chat-item.active {
            background: rgba(74, 124, 247, 0.12);
            border-color: rgba(74, 124, 247, 0.25);
        }

        .chat-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4a7cf7, #7c5cfc);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            flex-shrink: 0;
            border: 2px solid rgba(255, 255, 255, 0.06);
            overflow: hidden;
        }
        .chat-avatar img { width: 100%; height: 100%; object-fit: cover; }

        .chat-preview { flex: 1; min-width: 0; }
        .chat-preview .chat-name {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-preview .chat-last {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: rgba(255, 255, 255, 0.25);
            font-size: 15px;
            padding: 40px 20px;
            text-align: center;
        }
        .empty-state .emoji { font-size: 56px; opacity: 0.5; }

        /* ---------- ОКНО ЧАТА ---------- */
        .chat-view {
            position: absolute;
            inset: 0;
            background: rgba(10, 10, 18, 0.98);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            display: none;
            flex-direction: column;
            z-index: 20;
            animation: slideIn 0.3s ease;
        }
        .chat-view.active { display: flex; }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .chat-view-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            flex-shrink: 0;
            background: rgba(14, 14, 24, 0.6);
        }

        .chat-view-header .back-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 20px;
            color: white;
            flex-shrink: 0;
        }
        .chat-view-header .back-btn:hover { background: rgba(255, 255, 255, 0.12); }

        .chat-view-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4a7cf7, #7c5cfc);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
            border: 2px solid rgba(255, 255, 255, 0.06);
            overflow: hidden;
        }
        .chat-view-avatar img { width: 100%; height: 100%; object-fit: cover; }

        .chat-view-info { flex: 1; min-width: 0; }
        .chat-view-info .name {
            font-size: 16px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-view-info .status {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.35);
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .message {
            max-width: 78%;
            padding: 12px 16px;
            border-radius: 22px;
            font-size: 15px;
            line-height: 1.4;
            word-wrap: break-word;
            animation: msgIn 0.25s ease;
        }

        @keyframes msgIn {
            from { opacity: 0; transform: translateY(8px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .message.own {
            align-self: flex-end;
            background: linear-gradient(135deg, #4a7cf7, #7c5cfc);
            color: white;
            border-bottom-right-radius: 6px;
            box-shadow: 0 4px 16px -4px rgba(74, 124, 247, 0.4);
        }
        .message.other {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.07);
            color: rgba(255, 255, 255, 0.92);
            border-bottom-left-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .message .time {
            font-size: 10px;
            opacity: 0.6;
            margin-top: 4px;
            text-align: right;
        }
        .message.other .time { text-align: left; }

        .message-input-area {
            display: flex;
            gap: 10px;
            padding: 14px 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(14, 14, 24, 0.6);
            flex-shrink: 0;
            align-items: flex-end;
        }

        .message-input-area textarea {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 22px;
            padding: 14px 20px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
            font-family: inherit;
            resize: none;
            max-height: 120px;
            min-height: 50px;
            line-height: 1.4;
        }
        .message-input-area textarea::placeholder { color: rgba(255, 255, 255, 0.25); }
        .message-input-area textarea:focus {
            border-color: #4a7cf7;
            background: rgba(74, 124, 247, 0.06);
            box-shadow: 0 0 0 4px rgba(74, 124, 247, 0.1);
        }

        .send-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4a7cf7, #7c5cfc);
            border: none;
            color: white;
            font-size: 22px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 8px 20px -6px rgba(74, 124, 247, 0.5);
        }
        .send-btn:hover { transform: scale(1.08); }
        .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        /* ---------- МОДАЛКА ПРОФИЛЯ ---------- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
            animation: fadeIn 0.25s;
        }
        .modal-overlay.active { display: flex; }

        .modal {
            background: rgba(20, 20, 32, 0.95);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 32px;
            padding: 28px 24px;
            width: 100%;
            max-width: 420px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.9);
            animation: slideUp 0.3s ease;
            text-align: center;
        }

        .modal .avatar-large {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4a7cf7, #7c5cfc);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 56px;
            margin: 0 auto 18px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 16px 32px -8px rgba(74, 124, 247, 0.5);
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .modal .avatar-large:hover { transform: scale(1.03); }
        .modal .avatar-large img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .modal .avatar-large .overlay-hint {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 13px;
            color: white;
            font-weight: 500;
        }
        .modal .avatar-large:hover .overlay-hint { opacity: 1; }
        .modal .avatar-large .overlay-hint .plus {
            font-size: 32px;
            margin-bottom: 4px;
        }

        .modal h2 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
            word-break: break-word;
        }

        .modal .nickname {
            color: rgba(255, 255, 255, 0.45);
            font-size: 15px;
            margin-bottom: 16px;
            word-break: break-word;
        }

        .modal .user-id {
            display: inline-block;
            background: rgba(74, 124, 247, 0.15);
            border: 1px solid rgba(74, 124, 247, 0.3);
            border-radius: 12px;
            padding: 8px 16px;
            font-size: 12px;
            color: #7c9cff;
            font-family: monospace;
            letter-spacing: 0.5px;
            margin-bottom: 20px;
            word-break: break-all;
            cursor: pointer;
            transition: all 0.3s;
        }
        .modal .user-id:hover { background: rgba(74, 124, 247, 0.25); }

        .profile-section {
            text-align: left;
            margin-bottom: 18px;
            padding-bottom: 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        .profile-section:last-of-type {
            border-bottom: none;
            padding-bottom: 0;
        }
        .profile-section-title {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.35);
            margin-bottom: 10px;
            padding-left: 4px;
        }

        .profile-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 12px 16px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
            font-family: inherit;
        }
        .profile-input:focus {
            border-color: #4a7cf7;
            background: rgba(74, 124, 247, 0.06);
            box-shadow: 0 0 0 3px rgba(74, 124, 247, 0.1);
        }

        .input-row {
            display: flex;
            gap: 8px;
        }
        .input-row .profile-input { flex: 1; }

        .mini-btn {
            background: rgba(74, 124, 247, 0.15);
            border: 1px solid rgba(74, 124, 247, 0.3);
            color: #7c9cff;
            border-radius: 14px;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            white-space: nowrap;
        }
        .mini-btn:hover {
            background: rgba(74, 124, 247, 0.25);
            color: white;
        }
        .mini-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 6px;
            margin-top: 8px;
            max-height: 180px;
            overflow-y: auto;
            padding: 4px;
        }

        .emoji-option {
            aspect-ratio: 1;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }
        .emoji-option:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.1);
        }
        .emoji-option.selected {
            background: rgba(74, 124, 247, 0.2);
            border-color: #4a7cf7;
            transform: scale(1.1);
        }

        .avatar-tabs {
            display: flex;
            gap: 6px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 3px;
            margin-bottom: 10px;
        }
        .avatar-tab {
            flex: 1;
            padding: 8px;
            border-radius: 9px;
            border: none;
            background: transparent;
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }
        .avatar-tab.active {
            background: linear-gradient(135deg, #4a7cf7, #7c5cfc);
            color: white;
        }

        .avatar-pane { display: none; }
        .avatar-pane.active { display: block; }

        .file-upload-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px dashed rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            font-weight: 500;
        }
        .file-upload-btn:hover {
            background: rgba(74, 124, 247, 0.08);

<script>
    // ============================================================
    // FIREBASE CONFIG
    // ============================================================
    const firebaseConfig = {
        apiKey: "AIzaSyCqA6dtnpAKKBgBBhWcx5eDdOaCsizGE0",
        authDomain: "qwersachat.firebaseapp.com",
        projectId: "qwersachat",
        storageBucket: "qwersachat.firebasestorage.app",
        messagingSenderId: "216724212476",
        appId: "1:216724212476:web:a2c1b2f5962124b9a5e579",
        measurementId: "G-XCZFG4BDTD"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // ============================================================
    // ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
    // ============================================================
    let currentUser = null;
    let currentUserData = null;
    let currentChatId = null;
    let currentChatUser = null;
    let messagesUnsubscribe = null;
    let chatsUnsubscribe = null;

    // Эмодзи для выбора
    const EMOJIS = ['😎','😀','😄','😁','🤣','😊','😇','🙂','😉','😍','🥰','😘','😜','🤪','🤩','🥳',
                    '😏','😌','😴','🤤','😪','😷','🤒','🤕','🥶','🥵','😈','👻','💀','👽','🤖','🎃',
                    '🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐮','🐷','🐸','🐵','🦄',
                    '🐔','🐧','🐦','🦆','🦉','🦋','🐢','🐍','🐙','🦀','🐬','🐳','🦈','🐊','🦖','🦕',
                    '🍎','🍊','🍋','🍌','🍉','🍇','🍓','🍒','🍑','🥭','🍍','🥥','🥝','🍅','🥑','🍆',
                    '🍔','🍕','🌭','🍟','🌮','🌯','🥙','🍜','🍣','🍱','🍩','🍪','🎂','🍰','🍫','🍬',
                    '⚽','🏀','🏈','⚾','🎾','🏐','🏉','🎱','🏓','🏸','🥊','🎯','🎮','🎲','🎰','🎨',
                    '❤️','🧡','💛','💚','💙','💜','🖤','🤍','💔','💖','💘','💝','💞','💓','💕','❣️',
                    '🔥','⭐','🌟','✨','⚡','💥','💫','🌈','☀️','🌙','⛅','☁️','❄️','💧','🌊','🎉'];

    // ============================================================
    // DOM
    // ============================================================
    const authScreen = document.getElementById('authScreen');
    const mainScreen = document.getElementById('mainScreen');
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const tabLogin = document.getElementById('tabLogin');
    const tabRegister = document.getElementById('tabRegister');
    const loginError = document.getElementById('loginError');
    const regError = document.getElementById('regError');
    const headerAvatar = document.getElementById('headerAvatar');
    const headerName = document.getElementById('headerName');
    const headerNick = document.getElementById('headerNick');
    const chatList = document.getElementById('chatList');
    const chatView = document.getElementById('chatView');
    const chatViewAvatar = document.getElementById('chatViewAvatar');
    const chatViewName = document.getElementById('chatViewName');
    const messagesContainer = document.getElementById('messagesContainer');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const searchBar = document.getElementById('searchBar');
    const searchInput = document.getElementById('searchInput');
    const searchToggleBtn = document.getElementById('searchToggleBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const profileModal = document.getElementById('profileModal');
    const profileAvatar = document.getElementById('profileAvatar');
    const profileName = document.getElementById('profileName');
    const profileNick = document.getElementById('profileNick');
    const profileId = document.getElementById('profileId');
    const editName = document.getElementById('editName');
    const editUsername = document.getElementById('editUsername');
    const saveNameBtn = document.getElementById('saveNameBtn');
    const saveUsernameBtn = document.getElementById('saveUsernameBtn');
    const emojiGrid = document.getElementById('emojiGrid');
    const avatarFileInput = document.getElementById('avatarFileInput');
    const avatarTabEmoji = document.getElementById('avatarTabEmoji');
    const avatarTabPhoto = document.getElementById('avatarTabPhoto');
    const avatarPaneEmoji = document.getElementById('avatarPaneEmoji');
    const avatarPanePhoto = document.getElementById('avatarPanePhoto');
    const toast = document.getElementById('toast');

    // ============================================================
    // АВТОВХОД
    // ============================================================
    auth.onAuthStateChanged(async (user) => {
        if (user) {
            currentUser = user;
            try {
                const doc = await db.collection('users').doc(user.uid).get();
                if (doc.exists) {
                    currentUserData = doc.data();
                    // Миграция старых записей: гарантируем поля
                    if (!currentUserData.username && currentUserData.nickname) {
                        currentUserData.username = currentUserData.nickname;
                    }
                    if (!currentUserData.avatar) currentUserData.avatar = '😎';
                    if (!currentUserData.avatarType) currentUserData.avatarType = 'emoji';
                } else {
                    currentUserData = {
                        uid: user.uid,
                        name: user.displayName || 'Пользователь',
                        nickname: '@user' + user.uid.slice(0, 4),
                        username: '@user' + user.uid.slice(0, 4),
                        avatar: '😎',
                        avatarType: 'emoji',
                        email: user.email,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    };
                    await db.collection('users').doc(user.uid).set(currentUserData);
                }
                showMainScreen();
            } catch (e) {
                console.error('Ошибка загрузки профиля:', e);
                auth.signOut();
            }
        } else {
            currentUser = null;
            currentUserData = null;
            showAuthScreen();
        }
    });

    // ============================================================
    // ЭКРАНЫ
    // ============================================================
    function showAuthScreen() {
        authScreen.classList.add('active');
        mainScreen.classList.remove('active');
        if (messagesUnsubscribe) { messagesUnsubscribe(); messagesUnsubscribe = null; }
        if (chatsUnsubscribe) { chatsUnsubscribe(); chatsUnsubscribe = null; }
        closeChat();
        closeProfile();
    }

    function showMainScreen() {
        authScreen.classList.remove('active');
        mainScreen.classList.add('active');
        updateHeaderUI();
        loadChats();
        searchBar.style.display = 'none';
        searchInput.value = '';
    }

    function updateHeaderUI() {
        if (!currentUserData) return;
        renderAvatar(headerAvatar, currentUserData);
        headerName.textContent = currentUserData.name || 'Пользователь';
        headerNick.textContent = currentUserData.username || currentUserData.nickname || '@user';
    }

    // Универсальный рендер аватара (эмодзи или картинка)
    function renderAvatar(el, userData) {
        if (!userData) {
            el.textContent = '😎';
            return;
        }
        const type = userData.avatarType || 'emoji';
        const avatar = userData.avatar || '😎';

        if (type === 'image' && avatar && avatar.startsWith('data:image')) {
            el.innerHTML = `<img src="${avatar}" alt="avatar">`;
        } else {
            el.textContent = avatar;
        }
    }

    // ============================================================
    // АВТОРИЗАЦИЯ — ПЕРЕКЛЮЧЕНИЕ ФОРМ
    // ============================================================
    tabLogin.addEventListener('click', () => {
        tabLogin.classList.add('active');
        tabRegister.classList.remove('active');
        loginForm.classList.add('active');
        registerForm.classList.remove('active');
        loginError.classList.remove('show');
        regError.classList.remove('show');
    });

    tabRegister.addEventListener('click', () => {
        tabRegister.classList.add('active');
        tabLogin.classList.remove('active');
        registerForm.classList.add('active');
        loginForm.classList.remove('active');
        loginError.classList.remove('show');
        regError.classList.remove('show');
    });

    // ============================================================
    // РЕГИСТРАЦИЯ
    // ============================================================
    registerForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('regName').value.trim();
        let nickname = document.getElementById('regNick').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPassword').value;

        regError.classList.remove('show');

        if (!name || !nickname || !email || !password) {
            regError.textContent = 'Заполните все поля';
            regError.classList.add('show');
            return;
        }

        if (!nickname.startsWith('@')) nickname = '@' + nickname;

        const regBtn = document.getElementById('registerBtn');
        regBtn.disabled = true;
        regBtn.textContent = 'Создание...';

        try {
            const cred = await auth.createUserWithEmailAndPassword(email, password);
            const user = cred.user;
            await user.updateProfile({ displayName: name });

            const userData = {
                uid: user.uid,
                name: name,
                nickname: nickname,
                username: nickname,
                avatar: '😎',
                avatarType: 'emoji',
                email: email,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };
            await db.collection('users').doc(user.uid).set(userData);
            registerForm.reset();
        } catch (err) {
            console.error('REG ERROR:', err);
            let msg = 'Ошибка: ' + err.code;
            if (err.code === 'auth/email-already-in-use') msg = 'Этот email уже используется';
            else if (err.code === 'auth/weak-password') msg = 'Пароль минимум 6 символов';
            else if (err.code === 'auth/invalid-email') msg = 'Некорректный email';
            else if (err.code === 'auth/operation-not-allowed') msg = '❌ Включите Email/Password в Firebase';
            else if (err.code === 'permission-denied') msg = '❌ Firestore запрещает запись';
            else if (err.message) msg = '❌ ' + err.message;
            regError.textContent = msg;
            regError.classList.add('show');
        } finally {
            regBtn.disabled = false;
            regBtn.textContent = 'Создать аккаунт';
        }
    });

    // ============================================================
    // ВХОД
    // ============================================================
    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;

        loginError.classList.remove('show');

        const loginBtn = document.getElementById('loginBtn');
        loginBtn.disabled = true;
        loginBtn.textContent = 'Вход...';

        try {
            await auth.signInWithEmailAndPassword(email, password);
            loginForm.reset();
        } catch (err) {
            let msg = 'Ошибка входа';
            if (err.code === 'auth/user-not-found') msg = 'Пользователь не найден';
            else if (err.code === 'auth/wrong-password') msg = 'Неверный пароль';
            else if (err.code === 'auth/invalid-credential') msg = 'Неверный email или пароль';
            else if (err.code === 'auth/invalid-email') msg = 'Некорректный email';
            loginError.textContent = msg;
            loginError.classList.add('show');
        } finally {
            loginBtn.disabled = false;
            loginBtn.textContent = 'Войти';
        }
    });

    // ============================================================
    // ВЫХОД
    // ============================================================
    logoutBtn.addEventListener('click', async () => {
        if (messagesUnsubscribe) { messagesUnsubscribe(); messagesUnsubscribe = null; }
        if (chatsUnsubscribe) { chatsUnsubscribe(); chatsUnsubscribe = null; }
        await auth.signOut();
    });

    // ============================================================
    // ПОИСК
    // ============================================================
    searchToggleBtn.addEventListener('click', () => {
        if (searchBar.style.display === 'none' || searchBar.style.display === '') {
            searchBar.style.display = 'block';
            searchInput.focus();
        } else {
            searchBar.style.display = 'none';
            searchInput.value = '';
            loadChats();
        }
    });

    searchInput.addEventListener('input', async () => {
        const query = searchInput.value.trim().toLowerCase();
        if (query.length < 2) { loadChats(); return; }

        try {
            const snapshot = await db.collection('users').where('uid', '!=', currentUser.uid).get();
            const results = [];
            snapshot.forEach(doc => {
                const u = doc.data();
                const name = (u.name || '').toLowerCase();
                const username = (u.username || u.nickname || '').toLowerCase();
                const id = (u.uid || '').toLowerCase();
                if (name.includes(query) || username.includes(query) || id.includes(query)) {
                    results.push(u);
                }
            });
            renderSearchResults(results);
        } catch (e) {
            console.error('Ошибка поиска:', e);
        }
    });

    function renderSearchResults(users) {
        chatList.innerHTML = '';
        if (users.length === 0) {
            chatList.innerHTML = `<div class="empty-state"><div class="emoji">🔍</div><div>Ничего не найдено</div></div>`;
            return;
        }
        users.forEach(u => {
            const item = document.createElement('div');
            item.className = 'chat-item';
            const avatarHtml = (u.avatarType === 'image' && u.avatar?.startsWith('data:image'))
                ? `<img src="${u.avatar}" alt="">`
                : (u.avatar || '😎');
            item.innerHTML = `
                <div class="chat-avatar">${avatarHtml}</div>
                <div class="chat-preview">
                    <div class="chat-name">${escapeHtml(u.name || 'Без имени')}</div>
                    <div class="chat-last">${escapeHtml(u.username || u.nickname || '@user')} · ID: ${u.uid.slice(0, 8)}...</div>
                </div>
            `;
            item.addEventListener('click', () => openChatWithUser(u));
            chatList.appendChild(item);
        });
    }

    // ============================================================
    // СПИСОК ЧАТОВ
    // ============================================================
    function loadChats() {
        if (!currentUser) return;
        if (chatsUnsubscribe) { chatsUnsubscribe(); }

        chatsUnsubscribe = db.collection('userChats')
            .doc(currentUser.uid)
            .collection('chats')
            .orderBy('lastMessageTime', 'desc')
            .onSnapshot(async (snapshot) => {
                chatList.innerHTML = '';
                if (snapshot.empty) {
                    chatList.innerHTML = `
                        <div class="empty-state" id="emptyChats">
                            <div class="emoji">💬</div>
                            <div>У вас пока нет чатов</div>
                            <div style="font-size: 13px; opacity: 0.6;">Нажмите 🔍 чтобы найти собеседника</div>
                        </div>`;
                    return;
                }

                for (const doc of snapshot.docs) {
                    const chatData = doc.data();
                    const otherUid = chatData.otherUid;
                    const userDoc = await db.collection('users').doc(otherUid).get();
                    if (!userDoc.exists) continue;
                    const u = userDoc.data();

                    const item = document.createElement('div');
                    item.className = 'chat-item';
                    if (currentChatId === otherUid) item.classList.add('active');

                    const lastMsg = chatData.lastMessage || 'Нет сообщений';
                    const lastTime = chatData.lastMessageTime ? formatTime(chatData.lastMessageTime.toDate()) : '';

                    const avatarHtml = (u.avatarType === 'image' && u.avatar?.startsWith('data:image'))
                        ? `<img src="${u.avatar}" alt="">`
                        : (u.avatar || '😎');

                    item.innerHTML = `
                        <div class="chat-avatar">${avatarHtml}</div>
                        <div class="chat-preview">
                            <div class="chat-name">${escapeHtml(u.name || 'Без имени')}</div>
                            <div class="chat-last">${escapeHtml(lastMsg)} ${lastTime ? '· ' + lastTime : ''}</div>
                        </div>`;
                    item.addEventListener('click', () => openChatWithUser(u));
                    chatList.appendChild(item);
                }
            }, (error) => {
                console.error('Ошибка загрузки чатов:', error);
            });
    }

    // ============================================================
    // ОТКРЫТИЕ ЧАТА
    // ============================================================
    async function openChatWithUser(userData) {
        if (!currentUser) return;
        const otherUid = userData.uid;
        if (otherUid === currentUser.uid) {
            showToast('Нельзя открыть чат с самим собой', 'error');
            return;
        }

        currentChatId = otherUid;
        currentChatUser = userData;

        chatView.classList.add('active');
        renderAvatar(chatViewAvatar, userData);
        chatViewName.textContent = userData.name || 'Без имени';

        await ensureChatExists(otherUid);
        loadMessages(otherUid);
        setTimeout(() => messageInput.focus(), 200);
    }

    async function ensureChatExists(otherUid) {
        const chatId = [currentUser.uid, otherUid].sort().join('_');
        const chatRef = db.collection('chats').doc(chatId);
        const chatDoc = await chatRef.get();

        if (!chatDoc.exists) {
            await chatRef.set({
                participants: [currentUser.uid, otherUid],
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                lastMessage: '',
                lastMessageTime: firebase.firestore.FieldValue.serverTimestamp()
            });
        }

        await db.collection('userChats').doc(currentUser.uid)
            .collection('chats').doc(otherUid).set({
                otherUid: otherUid,
                chatId: chatId,
                lastMessage: '',
                lastMessageTime: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });

        await db.collection('userChats').doc(otherUid)
            .collection('chats').doc(currentUser.uid).set({
                otherUid: currentUser.uid,
                chatId: chatId,
                lastMessage: '',
                lastMessageTime: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });
    }

    function loadMessages(otherUid) {
        if (messagesUnsubscribe) { messagesUnsubscribe(); }
        const chatId = [currentUser.uid, otherUid].sort().join('_');

        messagesUnsubscribe = db.collection('chats').doc(chatId)
            .collection('messages')
            .orderBy('timestamp', 'asc')
            .onSnapshot((snapshot) => {
                messagesContainer.innerHTML = '';
                if (snapshot.empty) {
                    messagesContainer.innerHTML = `<div class="empty-state" style="flex:1;"><div class="emoji">👋</div><div>Начните переписку первым!</div></div>`;
                    return;
                }
                snapshot.forEach(doc => {
                    const msg = doc.data();
                    const isOwn = msg.senderId === currentUser.uid;
                    const div = document.createElement('div');
                    div.className = `message ${isOwn ? 'own' : 'other'}`;
                    div.innerHTML = `${escapeHtml(msg.text)}<div class="time">${formatTime(msg.timestamp?.toDate())}</div>`;
                    messagesContainer.appendChild(div);
                });
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            });
    }

    // ============================================================
    // ОТПРАВКА СООБЩЕНИЯ
    // ============================================================
    async function sendMessage() {
        const text = messageInput.value.trim();
        if (!text || !currentChatId || !currentUser) return;
        const otherUid = currentChatId;
        const chatId = [currentUser.uid, otherUid].sort().join('_');

        messageInput.value = '';
        messageInput.style.height = 'auto';
        sendBtn.disabled = true;

        try {
            await db.collection('chats').doc(chatId).collection('messages').add({
                senderId: currentUser.uid,
                text: text,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });

            const updateData = {
                lastMessage: text,
                lastMessageTime: firebase.firestore.FieldValue.serverTimestamp()
            };

            await db.collection('userChats').doc(currentUser.uid)
                .collection('chats').doc(otherUid).set(updateData, { merge: true });
            await db.collection('userChats').doc(otherUid)
                .collection('chats').doc(currentUser.uid).set(updateData, { merge: true });
        } catch (e) {
            console.error('Ошибка отправки:', e);
            showToast('Не удалось отправить сообщение', 'error');
        }
    }

    sendBtn.addEventListener('click', sendMessage);

    messageInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    messageInput.addEventListener('input', () => {
        sendBtn.disabled = messageInput.value.trim().length === 0;
        messageInput.style.height = 'auto';
        messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
    });

    function closeChat() {
        chatView.classList.remove('active');
        if (messagesUnsubscribe) { messagesUnsubscribe(); messagesUnsubscribe = null; }
        currentChatId = null;
        currentChatUser = null;
        messagesContainer.innerHTML = '';
    }

    // ============================================================
    // ПРОФИЛЬ — ОТКРЫТИЕ / ЗАКРЫТИЕ
    // ============================================================
    function openProfile() {
        if (!currentUserData) return;
        renderProfileUI();
        profileModal.classList.add('active');
        switchAvatarTab('emoji');
    }

    function closeProfile() {
        profileModal.classList.remove('active');
        avatarFileInput.value = '';
    }

    function renderProfileUI() {
        const d = currentUserData;
        // Аватар
        profileAvatar.innerHTML = '';
        if (d.avatarType === 'image' && d.avatar?.startsWith('data:image')) {
            const img = document.createElement('img');
            img.src = d.avatar;
            profileAvatar.appendChild(img);
        } else {
            profileAvatar.textContent = d.avatar || '😎';
        }
        // Пересоздаём оверлей
        const hint = document.createElement('div');
        hint.className = 'overlay-hint';
        hint.innerHTML = '<div class="plus">📷</div><div>Сменить</div>';
        profileAvatar.appendChild(hint);

        // Данные
        profileName.textContent = d.name || 'Пользователь';
        profileNick.textContent = d.username || d.nickname || '@user';
        profileId.textContent = 'ID: ' + (d.uid || currentUser.uid);

        // Поля редактирования
        editName.value = d.name || '';
        editUsername.value = d.username || d.nickname || '';

        // Эмодзи-сетка
        renderEmojiGrid();
    }

    function renderEmojiGrid() {
        emojiGrid.innerHTML = '';
        EMOJIS.forEach(emoji => {
            const btn = document.createElement('div');
            btn.className = 'emoji-option';
            if (currentUserData.avatarType !== 'image' && currentUserData.avatar === emoji) {
                btn.classList.add('selected');
            }
            btn.textContent = emoji;
            btn.addEventListener('click', () => selectEmoji(emoji));
            emojiGrid.appendChild(btn);
        });
    }

    // ============================================================
    // СМЕНА АВАТАРА — ЭМОДЗИ
    // ============================================================
    async function selectEmoji(emoji) {
        if (!currentUser) return;
        try {
            await db.collection('users').doc(currentUser.uid).update({
                avatar: emoji,
                avatarType: 'emoji'
            });
            currentUserData.avatar = emoji;
            currentUserData.avatarType = 'emoji';

            // Обновляем UI
            document.querySelectorAll('.emoji-option').forEach(el => {
                el.classList.toggle('selected', el.textContent === emoji);
            });
            renderProfileUI();
            updateHeaderUI();
            showToast('Аватар обновлён', 'success');
        } catch (e) {
            console.error('Ошибка смены аватара:', e);
            showToast('Не удалось изменить аватар', 'error');
        }
    }

    // ============================================================
    // СМЕНА АВАТАРА — КАРТИНКА
    // ============================================================
    avatarFileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        // Проверка типа
        const validTypes = ['image/png', 'image/jpeg', 'image/jpg', 'image/webp'];
        if (!validTypes.includes(file.type)) {
            showToast('Только .png, .jpg, .jpeg, .webp', 'error');
            avatarFileInput.value = '';
            return;
        }

        // Проверка размера (макс 1MB — Firestore document лимит 1MB)
        if (file.size > 1024 * 1024) {
            showToast('Файл слишком большой (макс 1 МБ)', 'error');
            avatarFileInput.value = '';
            return;
        }

        try {
            const dataUrl = await fileToDataURL(file);
            await db.collection('users').doc(currentUser.uid).update({
                avatar: dataUrl,
                avatarType: 'image'
            });
            currentUserData.avatar = dataUrl;
            currentUserData.avatarType = 'image';

            renderProfileUI();
            updateHeaderUI();
            showToast('Фото профиля обновлено', 'success');
        } catch (err) {
            console.error('Ошибка загрузки фото:', err);
            showToast('Не удалось загрузить фото', 'error');
        }
        avatarFileInput.value = '';
    });

    function fileToDataURL(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    // ============================================================
    // СМЕНА ИМЕНИ
    // ============================================================
    saveNameBtn.addEventListener('click', async () => {
        const newName = editName.value.trim();
        if (!newName) { showToast('Имя не может быть пустым', 'error'); return; }
        if (newName === currentUserData.name) { showToast('Имя не изменилось'); return; }

        saveNameBtn.disabled = true;
        try {
            await db.collection('users').doc(currentUser.uid).update({ name: newName });
            currentUserData.name = newName;
            profileName.textContent = newName;
            updateHeaderUI();
            showToast('Имя обновлено', 'success');
        } catch (e) {
            console.error(e);
            showToast('Не удалось изменить имя', 'error');
        } finally {
            saveNameBtn.disabled = false;
        }
    });

    // ============================================================
    // СМЕНА @USERNAME
    // ============================================================
    saveUsernameBtn.addEventListener('click', async () => {
        let newUsername = editUsername.value.trim();
        if (!newUsername) { showToast('Username не может быть пустым', 'error'); return; }
        if (!newUsername.startsWith('@')) newUsername = '@' + newUsername;

        // Валидация: только буквы, цифры, _
        if (!/^@[a-zA-Z0-9_]{3,20}$/.test(newUsername)) {
            showToast('3-20 символов: буквы, цифры, _', 'error');
            return;
        }

        const current = currentUserData.username || currentUserData.nickname;
        if (newUsername === current) { showToast('Username не изменился'); return; }

        saveUsernameBtn.disabled = true;
        try {
            // Проверка на занятость
            const check = await db.collection('users')
                .where('username', '==', newUsername).get();
            if (!check.empty) {
                const taken = check.docs.some(d => d.id !== currentUser.uid);
                if (taken) {
                    showToast('Этот username уже занят', 'error');
                    saveUsernameBtn.disabled = false;
                    return;
                }
            }

            await db.collection('users').doc(currentUser.uid).update({
                username: newUsername,
                nickname: newUsername
            });
            currentUserData.username = newUsername;
            currentUserData.nickname = newUsername;
            profileNick.textContent = newUsername;
            updateHeaderUI();
            showToast('Username обновлён', 'success');
        } catch (e) {
            console.error(e);
            showToast('Не удалось изменить username', 'error');
        } finally {
            saveUsernameBtn.disabled = false;
        }
    });

    // ============================================================
    // ПЕРЕКЛЮЧЕНИЕ ТАБОВ АВАТАРА
    // ============================================================
    function switchAvatarTab(tab) {
        if (tab === 'emoji') {
            avatarTabEmoji.classList.add('active');
            avatarTabPhoto.classList.remove('active');
            avatarPaneEmoji.classList.add('active');
            avatarPanePhoto.classList.remove('active');
        } else {
            avatarTabPhoto.classList.add('active');
            avatarTabEmoji.classList.remove('active');
            avatarPanePhoto.classList.add('active');
            avatarPaneEmoji.classList.remove('active');
        }
    }

    avatarTabEmoji.addEventListener('click', () => switchAvatarTab('emoji'));
    avatarTabPhoto.addEventListener('click', () => switchAvatarTab('photo'));

    // ============================================================
    // КОПИРОВАНИЕ ID
    // ============================================================
    function copyId() {
        const id = currentUserData?.uid || currentUser?.uid;
        if (id) {
            navigator.clipboard.writeText(id).then(() => {
                const original = profileId.textContent;
                profileId.textContent = '✅ Скопировано!';
                setTimeout(() => { profileId.textContent = original; }, 1500);
            }).catch(() => {
                showToast('Не удалось скопировать', 'error');
            });
        }
    }

    // ============================================================
    // ТОСТ
    // ============================================================
    let toastTimeout = null;
    function showToast(text, type = '') {
        toast.textContent = text;
        toast.className = 'toast show' + (type ? ' ' + type : '');
        if (toastTimeout) clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => { toast.className = 'toast'; }, 2500);
    }

    // ============================================================
    // ЗАКРЫТИЕ МОДАЛОК
    // ============================================================
    profileModal.addEventListener('click', (e) => {
        if (e.target === profileModal) closeProfile();
    });

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            if (profileModal.classList.contains('active')) closeProfile();
            else if (chatView.classList.contains('active')) closeChat();
        }
    });

    // ============================================================
    // УТИЛИТЫ
    // ============================================================
    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function formatTime(date) {
        if (!date) return '';
        const now = new Date();
        const d = new Date(date);
        const diff = now - d;
        if (diff < 60000) return 'только что';
        if (diff < 3600000) return Math.floor(diff / 60000) + ' мин назад';
        const hours = d.getHours().toString().padStart(2, '0');
        const minutes = d.getMinutes().toString().padStart(2, '0');
        if (d.toDateString() === now.toDateString()) return hours + ':' + minutes;
        const yesterday = new Date(now);
        yesterday.setDate(yesterday.getDate() - 1);
        if (d.toDateString() === yesterday.toDateString()) return 'вчера';
        const day = d.getDate().toString().padStart(2, '0');
        const month = (d.getMonth() + 1).toString().padStart(2, '0');
        return day + '.' + month;
    }

    // Экспорт функций в глобальную область (для inline-обработчиков)
    window.openProfile = openProfile;
    window.closeProfile = closeProfile;
    window.closeChat = closeChat;
    window.copyId = copyId;

    console.log('✅ QwersaChat загружен');
</script>
</body>
</html>
