<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QwersaChat · мессенджер</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        /* ---------- СБРОС И ГЛОБАЛЬНЫЕ СТИЛИ ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: #0a0a12;
            color: #ffffff;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #app {
            width: 100%;
            height: 100%;
            max-width: 1200px;
            max-height: 900px;
            display: flex;
            flex-direction: column;
            position: relative;
            background: rgba(12, 12, 20, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
        }

        /* скроллбар */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(124, 92, 252, 0.4);
            border-radius: 20px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(124, 92, 252, 0.7);
        }

        /* ---------- ЭКРАНЫ ---------- */
        .screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            animation: fadeIn 0.35s ease;
        }

        .screen.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        /* ---------- АВТОРИЗАЦИЯ ---------- */
        .auth-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow-y: auto;
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            background: rgba(20, 20, 32, 0.8);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 36px;
            padding: 40px 32px;
            box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.9);
            transition: all 0.3s;
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-logo h1 {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #4a7cf7, #7c5cfc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .auth-logo p {
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            margin-top: 6px;
        }

        .auth-tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            padding: 4px;
            margin-bottom: 28px;
        }

        .auth-tab {
            flex: 1;
            padding: 12px 0;
            text-align: center;
            border-radius: 16px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.5);
            transition: all 0.3s;
            user-select: none;
            background: transparent;
            border: none;
            font-family: inherit;
        }

        .auth-tab.active {
            background: linear-gradient(135deg, #4a7cf7, #7c5cfc);
            color: white;
            box-shadow: 0 8px 20px -6px rgba(74, 124, 247, 0.5);
        }

        .auth-form {
            display: none;
            flex-direction: column;
            gap: 16px;
            animation: slideUp 0.3s ease;
        }

        .auth-form.active {
            display: flex;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            padding-left: 4px;
            font-weight: 500;
        }

        .input-group input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 16px 20px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
            font-family: inherit;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        .input-group input:focus {
            border-color: #4a7cf7;
            background: rgba(74, 124, 247, 0.06);
            box-shadow: 0 0 0 4px rgba(74, 124, 247, 0.1);
        }

        .btn {
            background: linear-gradient(135deg, #4a7cf7, #7c5cfc);
            border: none;
            border-radius: 18px;
            padding: 16px 24px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 12px 28px -8px rgba(74, 124, 247, 0.5);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 18px 36px -8px rgba(74, 124, 247, 0.7);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .auth-error {
            background: rgba(255, 60, 60, 0.12);
            border: 1px solid rgba(255, 60, 60, 0.3);
            border-radius: 14px;
            padding: 12px 16px;
            font-size: 13px;
            color: #ff6b6b;
            display: none;
            margin-top: 4px;
        }

        .auth-error.show {
            display: block;
            animation: shake 0.4s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        /* ---------- ОСНОВНОЙ ЭКРАН ---------- */
        .main-header {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            gap: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(14, 14, 24, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 10;
            flex-shrink: 0;
        }

        .header-avatar {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4a7cf7, #7c5cfc);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
            cursor: pointer;
            transition: transform 0.3s;
            border: 2px solid rgba(255, 255, 255, 0.08);
        }

        .header-avatar:hover {
            transform: scale(1.05);
        }

        .header-info {
            flex: 1;
            min-width: 0;
        }

        .header-info .name {
            font-size: 16px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-info .nick {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 18px;
            color: rgba(255, 255, 255, 0.7);
            flex-shrink: 0;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            transform: scale(1.05);
        }

        .icon-btn.logout:hover {
            background: rgba(255, 60, 60, 0.2);
            color: #ff6b6b;
        }

        /* ---------- ПОИСК ---------- */
        .search-bar {
            padding: 12px 20px;
            flex-shrink: 0;
        }

        .search-bar input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 14px 20px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
            font-family: inherit;
        }

        .search-bar input::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }

        .search-bar input:focus {
            border-color: #4a7cf7;
            background: rgba(74, 124, 247, 0.06);
            box-shadow: 0 0 0 4px rgba(74, 124, 247, 0.1);
        }

        /* ---------- СПИСОК ЧАТОВ ---------- */
        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 12px 12px;
        }

        .chat-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            border-radius: 22px;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 4px;
            border: 1px solid transparent;
        }

        .chat-item:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.06);
        }

        .chat-item.active {
            background: rgba(74, 124, 247, 0.12);
            border-color: rgba(74, 124, 247, 0.25);
        }

        .chat-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4a7cf7, #7c5cfc);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            flex-shrink: 0;
            border: 2px solid rgba(255, 255, 255, 0.06);
        }

        .chat-preview {
            flex: 1;
            min-width: 0;
        }

        .chat-preview .chat-name {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-preview .chat-last {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: rgba(255, 255, 255, 0.25);
            font-size: 15px;
            padding: 40px 20px;
            text-align: center;
        }

        .empty-state .emoji {
            font-size: 56px;
            opacity: 0.5;
        }

        /* ---------- ОКНО ЧАТА ---------- */
        .chat-view {
            position: absolute;
            inset: 0;
            background: rgba(10, 10, 18, 0.98);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            display: none;
            flex-direction: column;
            z-index: 20;
            animation: slideIn 0.3s ease;
        }

        .chat-view.active {
            display: flex;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .chat-view-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            flex-shrink: 0;
            background: rgba(14, 14, 24, 0.6);
        }

        .chat-view-header .back-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 20px;
            color: white;
            flex-shrink: 0;
        }

        .chat-view-header .back-btn:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .chat-view-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4a7cf7, #7c5cfc);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
            border: 2px solid rgba(255, 255, 255, 0.06);
        }

        .chat-view-info {
            flex: 1;
            min-width: 0;
        }

        .chat-view-info .name {
            font-size: 16px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-view-info .status {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.35);
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .message {
            max-width: 78%;
            padding: 12px 16px;
            border-radius: 22px;
            font-size: 15px;
            line-height: 1.4;
            word-wrap: break-word;
            animation: msgIn 0.25s ease;
            position: relative;
        }

        @keyframes msgIn {
            from { opacity: 0; transform: translateY(8px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .message.own {
            align-self: flex-end;
            background: linear-gradient(135deg, #4a7cf7, #7c5cfc);
            color: white;
            border-bottom-right-radius: 6px;
            box-shadow: 0 4px 16px -4px rgba(74, 124, 247, 0.4);
        }

        .message.other {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.07);
            color: rgba(255, 255, 255, 0.92);
            border-bottom-left-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .message .time {
            font-size: 10px;
            opacity: 0.6;
            margin-top: 4px;
            text-align: right;
        }

        .message.other .time {
            text-align: left;
        }

        .message-input-area {
            display: flex;
            gap: 10px;
            padding: 14px 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(14, 14, 24, 0.6);
            flex-shrink: 0;
            align-items: flex-end;
        }

        .message-input-area textarea {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 22px;
            padding: 14px 20px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
            font-family: inherit;
            resize: none;
            max-height: 120px;
            min-height: 50px;
            line-height: 1.4;
        }

        .message-input-area textarea::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }

        .message-input-area textarea:focus {
            border-color: #4a7cf7;
            background: rgba(74, 124, 247, 0.06);
            box-shadow: 0 0 0 4px rgba(74, 124, 247, 0.1);
        }

        .send-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4a7cf7, #7c5cfc);
            border: none;
            color: white;
            font-size: 22px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 8px 20px -6px rgba(74, 124, 247, 0.5);
        }

        .send-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 12px 28px -6px rgba(74, 124, 247, 0.7);
        }

        .send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        /* ---------- ПРОФИЛЬ (МОДАЛКА) ---------- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
            animation: fadeIn 0.25s;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: rgba(20, 20, 32, 0.95);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 32px;
            padding: 32px 28px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.9);
            animation: slideUp 0.3s ease;
            text-align: center;
        }

        .modal .avatar-large {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4a7cf7, #7c5cfc);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            margin: 0 auto 18px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 16px 32px -8px rgba(74, 124, 247, 0.5);
        }

        .modal h2 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .modal .nickname {
            color: rgba(255, 255, 255, 0.45);
            font-size: 15px;
            margin-bottom: 8px;
        }

        .modal .user-id {
            display: inline-block;
            background: rgba(74, 124, 247, 0.15);
            border: 1px solid rgba(74, 124, 247, 0.3);
            border-radius: 12px;
            padding: 8px 16px;
            font-size: 13px;
            color: #7c9cff;
            font-family: monospace;
            letter-spacing: 0.5px;
            margin-bottom: 24px;
            word-break: break-all;
            cursor: pointer;
            transition: all 0.3s;
        }

        .modal .user-id:hover {
            background: rgba(74, 124, 247, 0.25);
        }

        .modal .btn-close {
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            padding: 14px;
            color: white;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .modal .btn-close:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        /* ---------- АДАПТИВ ---------- */
        @media (max-width: 640px) {
            #app {
                border-radius: 0;
                max-height: none;
                max-width: none;
            }

            .auth-card {
                padding: 32px 24px;
                border-radius: 28px;
            }

            .message {
                max-width: 85%;
            }

            .main-header {
                padding: 12px 14px;
            }

            .header-avatar {
                width: 42px;
                height: 42px;
                font-size: 22px;
            }

            .icon-btn {
                width: 38px;
                height: 38px;
                font-size: 16px;
            }
        }

        /* утилита для скрытия */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div id="app">
    <!-- ЭКРАН АВТОРИЗАЦИИ -->
    <div class="screen active" id="authScreen">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-logo">
                    <h1>QwersaChat</h1>
                    <p>общайся без границ</p>
                </div>

                <div class="auth-tabs">
                    <button class="auth-tab active" id="tabLogin" type="button">Вход</button>
                    <button class="auth-tab" id="tabRegister" type="button">Регистрация</button>
                </div>

                <!-- Форма входа -->
                <form class="auth-form active" id="loginForm">
                    <div class="input-group">
                        <label>Email</label>
                        <input type="email" id="loginEmail" placeholder="you@example.com" required>
                    </div>
                    <div class="input-group">
                        <label>Пароль</label>
                        <input type="password" id="loginPassword" placeholder="••••••••" required minlength="6">
                    </div>
                    <div class="auth-error" id="loginError"></div>
                    <button type="submit" class="btn" id="loginBtn">Войти</button>
                </form>

                <!-- Форма регистрации -->
                <form class="auth-form" id="registerForm">
                    <div class="input-group">
                        <label>Имя</label>
                        <input type="text" id="regName" placeholder="Иван Иванов" required maxlength="40">
                    </div>
                    <div class="input-group">
                        <label>Никнейм</label>
                        <input type="text" id="regNick" placeholder="@ivan" required maxlength="20">
                    </div>
                    <div class="input-group">
                        <label>Email</label>
                        <input type="email" id="regEmail" placeholder="you@example.com" required>
                    </div>
                    <div class="input-group">
                        <label>Пароль</label>
                        <input type="password" id="regPassword" placeholder="минимум 6 символов" required minlength="6">
                    </div>
                    <div class="auth-error" id="regError"></div>
                    <button type="submit" class="btn" id="registerBtn">Создать аккаунт</button>
                </form>
            </div>
        </div>
    </div>

    <!-- ОСНОВНОЙ ЭКРАН -->
    <div class="screen" id="mainScreen">
        <!-- Шапка -->
        <div class="main-header">
            <div class="header-avatar" id="headerAvatar" onclick="openProfile()">😎</div>
            <div class="header-info">
                <div class="name" id="headerName">Имя</div>
                <div class="nick" id="headerNick">@nick</div>
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="searchToggleBtn" title="Поиск по ID">🔍</button>
                <button class="icon-btn logout" id="logoutBtn" title="Выйти">🚪</button>
            </div>
        </div>

        <!-- Поиск -->
        <div class="search-bar" id="searchBar" style="display: none;">
            <input type="text" id="searchInput" placeholder="Введите ID пользователя или имя...">
        </div>

        <!-- Список чатов -->
        <div class="chat-list" id="chatList">
            <div class="empty-state" id="emptyChats">
                <div class="emoji">💬</div>
                <div>У вас пока нет чатов</div>
                <div style="font-size: 13px; opacity: 0.6;">Нажмите 🔍 чтобы найти собеседника</div>
            </div>
        </div>

        <!-- Окно чата -->
        <div class="chat-view" id="chatView">
            <div class="chat-view-header">
                <div class="back-btn" onclick="closeChat()">←</div>
                <div class="chat-view-avatar" id="chatViewAvatar">🙂</div>
                <div class="chat-view-info">
                    <div class="name" id="chatViewName">Имя</div>
                    <div class="status" id="chatViewStatus">в сети</div>
                </div>
            </div>
            <div class="messages-container" id="messagesContainer"></div>
            <div class="message-input-area">
                <textarea id="messageInput" placeholder="Напишите сообщение..." rows="1"></textarea>
                <button class="send-btn" id="sendBtn" disabled>➤</button>
            </div>
        </div>
    </div>
</div>

<!-- МОДАЛКА ПРОФИЛЯ -->
<div class="modal-overlay" id="profileModal">
    <div class="modal">
        <div class="avatar-large" id="profileAvatar">😎</div>
        <h2 id="profileName">Имя</h2>
        <div class="nickname" id="profileNick">@nickname</div>
        <div class="user-id" id="profileId" onclick="copyId()">ID: ...</div>
        <button class="btn-close" onclick="closeProfile()">Закрыть</button>
    </div>
</div>

<script>
    // ============================================================
    // 1. FIREBASE CONFIG & INIT
    // ============================================================
    const firebaseConfig = {
        apiKey: "AIzaSyCqA6dtnpAKKBgBBh5Wcx5eDdOaCsizGE0",
        authDomain: "qwersachat.firebaseapp.com",
        projectId: "qwersachat",
        storageBucket: "qwersachat.firebasestorage.app",
        messagingSenderId: "216724212476",
        appId: "1:216724212476:web:a2c1b2f5962124b9a5e579",
        measurementId: "G-XCZFG4BDTD"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // ============================================================
    // 2. ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
    // ============================================================
    let currentUser = null;           // firebase.auth().currentUser
    let currentUserData = null;       // данные из Firestore
    let currentChatId = null;         // ID активного чата (uid собеседника)
    let currentChatUser = null;       // данные собеседника
    let messagesUnsubscribe = null;   // отписка от сообщений
    let chatsUnsubscribe = null;      // отписка от списка чатов

    // DOM элементы
    const authScreen = document.getElementById('authScreen');
    const mainScreen = document.getElementById('mainScreen');
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const tabLogin = document.getElementById('tabLogin');
    const tabRegister = document.getElementById('tabRegister');
    const loginError = document.getElementById('loginError');
    const regError = document.getElementById('regError');
    const headerAvatar = document.getElementById('headerAvatar');
    const headerName = document.getElementById('headerName');
    const headerNick = document.getElementById('headerNick');
    const chatList = document.getElementById('chatList');
    const emptyChats = document.getElementById('emptyChats');
    const chatView = document.getElementById('chatView');
    const chatViewAvatar = document.getElementById('chatViewAvatar');
    const chatViewName = document.getElementById('chatViewName');
    const messagesContainer = document.getElementById('messagesContainer');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const searchBar = document.getElementById('searchBar');
    const searchInput = document.getElementById('searchInput');
    const searchToggleBtn = document.getElementById('searchToggleBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const profileModal = document.getElementById('profileModal');
    const profileAvatar = document.getElementById('profileAvatar');
    const profileName = document.getElementById('profileName');
    const profileNick = document.getElementById('profileNick');
    const profileId = document.getElementById('profileId');

    // ============================================================
    // 3. АВТОВХОД ЧЕРЕЗ onAuthStateChanged
    // ============================================================
    auth.onAuthStateChanged(async (user) => {
        if (user) {
            currentUser = user;
            // Загружаем данные пользователя из Firestore
            try {
                const doc = await db.collection('users').doc(user.uid).get();
                if (doc.exists) {
                    currentUserData = doc.data();
                } else {
                    // Если документа нет — создаём базовый
                    currentUserData = {
                        uid: user.uid,
                        name: user.displayName || 'Пользователь',
                        nickname: '@user' + user.uid.slice(0, 4),
                        avatar: '😎',
                        email: user.email,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    };
                    await db.collection('users').doc(user.uid).set(currentUserData);
                }
                showMainScreen();
            } catch (e) {
                console.error('Ошибка загрузки профиля:', e);
                auth.signOut();
            }
        } else {
            currentUser = null;
            currentUserData = null;
            showAuthScreen();
        }
    });

    // ============================================================
    // 4. ПЕРЕКЛЮЧЕНИЕ ЭКРАНОВ
    // ============================================================
    function showAuthScreen() {
        authScreen.classList.add('active');
        mainScreen.classList.remove('active');
        // Очищаем подписки
        if (messagesUnsubscribe) { messagesUnsubscribe(); messagesUnsubscribe = null; }
        if (chatsUnsubscribe) { chatsUnsubscribe(); chatsUnsubscribe = null; }
        closeChat();
        closeProfile();
    }

    function showMainScreen() {
        authScreen.classList.remove('active');
        mainScreen.classList.add('active');
        updateHeaderUI();
        loadChats();
        // Закрываем поиск при входе
        searchBar.style.display = 'none';
        searchInput.value = '';
    }

    // ============================================================
    // 5. ОБНОВЛЕНИЕ UI ШАПКИ
    // ============================================================
    function updateHeaderUI() {
        if (!currentUserData) return;
        headerAvatar.textContent = currentUserData.avatar || '😎';
        headerName.textContent = currentUserData.name || 'Пользователь';
        headerNick.textContent = currentUserData.nickname || '@user';
    }

    // ============================================================
    // 6. ПЕРЕКЛЮЧЕНИЕ ФОРМ АВТОРИЗАЦИИ
    // ============================================================
    tabLogin.addEventListener('click', () => {
        tabLogin.classList.add('active');
        tabRegister.classList.remove('active');
        loginForm.classList.add('active');
        registerForm.classList.remove('active');
        loginError.classList.remove('show');
        regError.classList.remove('show');
    });

    tabRegister.addEventListener('click', () => {
        tabRegister.classList.add('active');
        tabLogin.classList.remove('active');
        registerForm.classList.add('active');
        loginForm.classList.remove('active');
        loginError.classList.remove('show');
        regError.classList.remove('show');
    });

    // ============================================================
    // 7. РЕГИСТРАЦИЯ
    // ============================================================
    registerForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('regName').value.trim();
        const nickname = document.getElementById('regNick').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPassword').value;

        regError.classList.remove('show');

        if (!name || !nickname || !email || !password) {
            regError.textContent = 'Заполните все поля';
            regError.classList.add('show');
            return;
        }

        const regBtn = document.getElementById('registerBtn');
        regBtn.disabled = true;
        regBtn.textContent = 'Создание...';

        try {
            const cred = await auth.createUserWithEmailAndPassword(email, password);
            const user = cred.user;

            // Обновляем displayName
            await user.updateProfile({ displayName: name });

            // Сохраняем в Firestore
            const userData = {
                uid: user.uid,
                name: name,
                nickname: nickname.startsWith('@') ? nickname : '@' + nickname,
                avatar: '😎',
                email: email,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };
            await db.collection('users').doc(user.uid).set(userData);

            // onAuthStateChanged сработает автоматически
            registerForm.reset();
        } catch (err) {
            console.error(err);
            let msg = 'Ошибка регистрации';
            if (err.code === 'auth/email-already-in-use') msg = 'Этот email уже используется';
            else if (err.code === 'auth/weak-password') msg = 'Пароль слишком слабый (минимум 6 символов)';
            else if (err.code === 'auth/invalid-email') msg = 'Некорректный email';
            regError.textContent = msg;
            regError.classList.add('show');
        } finally {
            regBtn.disabled = false;
            regBtn.textContent = 'Создать аккаунт';
        }
    });

    // ============================================================
    // 8. ВХОД
    // ============================================================
    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;

        loginError.classList.remove('show');

        const loginBtn = document.getElementById('loginBtn');
        loginBtn.disabled = true;
        loginBtn.textContent = 'Вход...';

        try {
            await auth.signInWithEmailAndPassword(email, password);
            // onAuthStateChanged сработает
            loginForm.reset();
        } catch (err) {
            console.error(err);
            let msg = 'Ошибка входа';
            if (err.code === 'auth/user-not-found') msg = 'Пользователь не найден';
            else if (err.code === 'auth/wrong-password') msg = 'Неверный пароль';
            else if (err.code === 'auth/invalid-email') msg = 'Некорректный email';
            else if (err.code === 'auth/invalid-credential') msg = 'Неверный email или пароль';
            loginError.textContent = msg;
            loginError.classList.add('show');
        } finally {
            loginBtn.disabled = false;
            loginBtn.textContent = 'Войти';
        }
    });

    // ============================================================
    // 9. ВЫХОД
    // ============================================================
    logoutBtn.addEventListener('click', async () => {
        if (messagesUnsubscribe) { messagesUnsubscribe(); messagesUnsubscribe = null; }
        if (chatsUnsubscribe) { chatsUnsubscribe(); chatsUnsubscribe = null; }
        await auth.signOut();
    });

    // ============================================================
    // 10. ПОИСК (ПОКАЗ/СКРЫТИЕ)
    // ============================================================
    searchToggleBtn.addEventListener('click', () => {
        if (searchBar.style.display === 'none' || searchBar.style.display === '') {
            searchBar.style.display = 'block';
            searchInput.focus();
        } else {
            searchBar.style.display = 'none';
            searchInput.value = '';
            loadChats(); // сброс поиска
        }
    });

    // ============================================================
    // 11. ПОИСК ПОЛЬЗОВАТЕЛЯ
    // ============================================================
    searchInput.addEventListener('input', async () => {
        const query = searchInput.value.trim().toLowerCase();
        if (query.length < 2) {
            loadChats();
            return;
        }

        try {
            // Ищем по нику или имени (без учёта регистра)
            const usersRef = db.collection('users');
            // Получаем всех кроме себя
            const snapshot = await usersRef.where('uid', '!=', currentUser.uid).get();

            const results = [];
            snapshot.forEach(doc => {
                const u = doc.data();
                const name = (u.name || '').toLowerCase();
                const nick = (u.nickname || '').toLowerCase();
                const id = (u.uid || '').toLowerCase();
                if (name.includes(query) || nick.includes(query) || id.includes(query)) {
                    results.push(u);
                }
            });

            renderSearchResults(results);
        } catch (e) {
            console.error('Ошибка поиска:', e);
        }
    });

    function renderSearchResults(users) {
        chatList.innerHTML = '';
        if (users.length === 0) {
            chatList.innerHTML = `
                <div class="empty-state">
                    <div class="emoji">🔍</div>
                    <div>Ничего не найдено</div>
                </div>
            `;
            return;
        }

        users.forEach(u => {
            const item = document.createElement('div');
            item.className = 'chat-item';
            item.innerHTML = `
                <div class="chat-avatar">${u.avatar || '😎'}</div>
                <div class="chat-preview">
                    <div class="chat-name">${escapeHtml(u.name || 'Без имени')}</div>
                    <div class="chat-last">${escapeHtml(u.nickname || '@user')} · ID: ${u.uid.slice(0, 8)}...</div>
                </div>
            `;
            item.addEventListener('click', () => openChatWithUser(u));
            chatList.appendChild(item);
        });
    }

    // ============================================================
    // 12. ЗАГРУЗКА СПИСКА ЧАТОВ (из коллекции userChats)
    // ============================================================
    function loadChats() {
        if (!currentUser) return;

        if (chatsUnsubscribe) { chatsUnsubscribe(); }

        // Подписываемся на коллекцию чатов текущего пользователя
        chatsUnsubscribe = db.collection('userChats')
            .doc(currentUser.uid)
            .collection('chats')
            .orderBy('lastMessageTime', 'desc')
            .onSnapshot(async (snapshot) => {
                chatList.innerHTML = '';

                if (snapshot.empty) {
                    chatList.innerHTML = `
                        <div class="empty-state" id="emptyChats">
                            <div class="emoji">💬</div>
                            <div>У вас пока нет чатов</div>
                            <div style="font-size: 13px; opacity: 0.6;">Нажмите 🔍 чтобы найти собеседника</div>
                        </div>
                    `;
                    return;
                }

                for (const doc of snapshot.docs) {
                    const chatData = doc.data();
                    const otherUid = chatData.otherUid;

                    // Получаем данные собеседника
                    const userDoc = await db.collection('users').doc(otherUid).get();
                    if (!userDoc.exists) continue;
                    const u = userDoc.data();

                    const item = document.createElement('div');
                    item.className = 'chat-item';
                    if (currentChatId === otherUid) item.classList.add('active');

                    const lastMsg = chatData.lastMessage || 'Нет сообщений';
                    const lastTime = chatData.lastMessageTime ?
                        formatTime(chatData.lastMessageTime.toDate()) : '';

                    item.innerHTML = `
                        <div class="chat-avatar">${u.avatar || '😎'}</div>
                        <div class="chat-preview">
                            <div class="chat-name">${escapeHtml(u.name || 'Без имени')}</div>
                            <div class="chat-last">${escapeHtml(lastMsg)} ${lastTime ? '· ' + lastTime : ''}</div>
                        </div>
                    `;

                    item.addEventListener('click', () => {
                        openChatWithUser(u);
                    });

                    chatList.appendChild(item);
                }
            }, (error) => {
                console.error('Ошибка загрузки чатов:', error);
            });
    }

    // ============================================================
    // 13. ОТКРЫТИЕ ЧАТА С ПОЛЬЗОВАТЕЛЕМ
    // ============================================================
    async function openChatWithUser(userData) {
        if (!currentUser) return;

        const otherUid = userData.uid;
        if (otherUid === currentUser.uid) {
            alert('Нельзя открыть чат с самим собой');
            return;
        }

        currentChatId = otherUid;
        currentChatUser = userData;

        // Показываем окно чата
        chatView.classList.add('active');
        chatViewAvatar.textContent = userData.avatar || '😎';
        chatViewName.textContent = userData.name || 'Без имени';

        // Создаём/обновляем запись чата в userChats для обоих пользователей
        await ensureChatExists(otherUid, userData);

        // Загружаем сообщения
        loadMessages(otherUid);

        // Фокус на поле ввода
        setTimeout(() => messageInput.focus(), 200);
    }

    async function ensureChatExists(otherUid, otherData) {
        const chatId = [currentUser.uid, otherUid].sort().join('_');

        // Проверяем, существует ли чат
        const chatRef = db.collection('chats').doc(chatId);
        const chatDoc = await chatRef.get();

        if (!chatDoc.exists) {
            await chatRef.set({
                participants: [currentUser.uid, otherUid],
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                lastMessage: '',
                lastMessageTime: firebase.firestore.FieldValue.serverTimestamp()
            });
        }

        // Добавляем чат в список текущего пользователя
        await db.collection('userChats').doc(currentUser.uid)
            .collection('chats').doc(otherUid).set({
                otherUid: otherUid,
                chatId: chatId,
                lastMessage: '',
                lastMessageTime: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });

        // Добавляем чат в список собеседника
        await db.collection('userChats').doc(otherUid)
            .collection('chats').doc(currentUser.uid).set({
                otherUid: currentUser.uid,
                chatId: chatId,
                lastMessage: '',
                lastMessageTime: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });
    }

    // ============================================================
    // 14. ЗАГРУЗКА СООБЩЕНИЙ
    // ============================================================
    function loadMessages(otherUid) {
        if (messagesUnsubscribe) { messagesUnsubscribe(); }

        const chatId = [currentUser.uid, otherUid].sort().join('_');

        messagesUnsubscribe = db.collection('chats').doc(chatId)
            .collection('messages')
            .orderBy('timestamp', 'asc')
            .onSnapshot((snapshot) => {
                messagesContainer.innerHTML = '';
                if (snapshot.empty) {
                    messagesContainer.innerHTML = `
                        <div class="empty-state" style="flex:1;">
                            <div class="emoji">👋</div>
                            <div>Начните переписку первым!</div>
                        </div>
                    `;
                    return;
                }

                snapshot.forEach(doc => {
                    const msg = doc.data();
                    const isOwn = msg.senderId === currentUser.uid;
                    const div = document.createElement('div');
                    div.className = `message ${isOwn ? 'own' : 'other'}`;
                    div.innerHTML = `
                        ${escapeHtml(msg.text)}
                        <div class="time">${formatTime(msg.timestamp?.toDate())}</div>
                    `;
                    messagesContainer.appendChild(div);
                });

                // Прокрутка вниз
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            });
    }

    // ============================================================
    // 15. ОТПРАВКА СООБЩЕНИЯ
    // ============================================================
    async function sendMessage() {
        const text = messageInput.value.trim();
        if (!text || !currentChatId || !currentUser) return;

        const otherUid = currentChatId;
        const chatId = [currentUser.uid, otherUid].sort().join('_');

        messageInput.value = '';
        messageInput.style.height = 'auto';
        sendBtn.disabled = true;

        try {
            // Добавляем сообщение
            await db.collection('chats').doc(chatId)
                .collection('messages').add({
                    senderId: currentUser.uid,
                    text: text,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

            // Обновляем последнее сообщение в обоих userChats
            const updateData = {
                lastMessage: text,
                lastMessageTime: firebase.firestore.FieldValue.serverTimestamp()
            };

            await db.collection('userChats').doc(currentUser.uid)
                .collection('chats').doc(otherUid).set(updateData, { merge: true });

            await db.collection('userChats').doc(otherUid)
                .collection('chats').doc(currentUser.uid).set(updateData, { merge: true });

        } catch (e) {
            console.error('Ошибка отправки:', e);
            alert('Не удалось отправить сообщение');
        }
    }

    sendBtn.addEventListener('click', sendMessage);

    messageInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    messageInput.addEventListener('input', () => {
        sendBtn.disabled = messageInput.value.trim().length === 0;
        // Автовысота
        messageInput.style.height = 'auto';
        messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
    });

    // ============================================================
    // 16. ЗАКРЫТИЕ ЧАТА
    // ============================================================
    function closeChat() {
        chatView.classList.remove('active');
        if (messagesUnsubscribe) { messagesUnsubscribe(); messagesUnsubscribe = null; }
        currentChatId = null;
        currentChatUser = null;
        messagesContainer.innerHTML = '';
        // Обновляем активный элемент в списке
        document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));
    }

    // ============================================================
    // 17. ПРОФИЛЬ
    // ============================================================
    function openProfile() {
        if (!currentUserData) return;
        profileAvatar.textContent = currentUserData.avatar || '😎';
        profileName.textContent = currentUserData.name || 'Пользователь';
        profileNick.textContent = currentUserData.nickname || '@user';
        profileId.textContent = 'ID: ' + (currentUserData.uid || currentUser.uid);
        profileModal.classList.add('active');
    }

    function closeProfile() {
        profileModal.classList.remove('active');
    }

    function copyId() {
        const id = currentUserData?.uid || currentUser?.uid;
        if (id) {
            navigator.clipboard.writeText(id).then(() => {
                const el = profileId;
                const original = el.textContent;
                el.textContent = '✅ Скопировано!';
                setTimeout(() => { el.textContent = original; }, 1500);
            }).catch(() => {});
        }
    }

    // Закрытие модалки по клику на оверлей
    profileModal.addEventListener('click', (e) => {
        if (e.target === profileModal) closeProfile();
    });

    // ============================================================
    // 18. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
    // ============================================================
    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function formatTime(date) {
        if (!date) return '';
        const now = new Date();
        const d = new Date(date);
        const diff = now - d;

        if (diff < 60000) return 'только что';
        if (diff < 3600000) return Math.floor(diff / 60000) + ' мин назад';

        const hours = d.getHours().toString().padStart(2, '0');
        const minutes = d.getMinutes().toString().padStart(2, '0');

        // Если сегодня
        if (d.toDateString() === now.toDateString()) {
            return hours + ':' + minutes;
        }

        // Если вчера
        const yesterday = new Date(now);
        yesterday.setDate(yesterday.getDate() - 1);
        if (d.toDateString() === yesterday.toDateString()) {
            return 'вчера';
        }

        // Иначе дата
        const day = d.getDate().toString().padStart(2, '0');
        const month = (d.getMonth() + 1).toString().padStart(2, '0');
        return day + '.' + month;
    }

    // ============================================================
    // 19. ЗАКРЫТИЕ ЧАТА ПО ESC
    // ============================================================
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            if (profileModal.classList.contains('active')) closeProfile();
            else if (chatView.classList.contains('active')) closeChat();
        }
    });

    // ============================================================
    // 20. НАЧАЛЬНАЯ ЗАГРУЗКА (если пользователь уже авторизован)
    // ============================================================
    // onAuthStateChanged сам всё сделает

    console.log('✅ QwersaChat загружен');
</script>

</body>
</html>
